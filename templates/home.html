<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FWI Prediction</title>
</head>

<body>
    <h1>FWI Prediction</h1>

    <form action="{{url_for('predict_datapoint')}}" method="post">
        <label for="temperature">Temperature (°C):</label>
        <input type="number" id="temperature" name="temperature" step="0.1" required><br><br>

        <label for="RH">Relative Humidity (%):</label>
        <input type="number" id="RH" name="RH" step="0.1" required><br><br>

        <label for="Ws">Wind Speed (km/h):</label>
        <input type="number" id="Ws" name="Ws" step="0.1" required><br><br>

        <label for="Rain">Rain (mm):</label>
        <input type="number" id="Rain" name="Rain" step="0.1" required><br><br>

        <label for="FFMC">Fine Fuel Moisture Code (FFMC):</label>
        <input type="number" id="FFMC" name="FFMC" step="0.1" required><br><br>

        <label for="DMC">Duff Moisture Code (DMC):</label>
        <input type="number" id="DMC" name="DMC" step="0.1" required><br><br>

        <label for="ISI">Initial Spread Index (ISI):</label>
        <input type="number" id="ISI" name="ISI" step="0.1" required><br><br>

        <label for="Classes">Classes:</label>
        <input type="text" id="Classes" name="Classes" required><br><br>

        <label for="region">Region:</label>
        <input type="text" id="region" name="region" required><br><br>

        <button type="submit">Predict FWI</button>
    </form>

    <h2> The FWI Predicition is {{result}}</h2>
</body>

</html>
